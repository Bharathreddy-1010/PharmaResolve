services:
  # 1. FastAPI Backend Service
  - type: web
    name: pharmaresolve-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: pharmaresolve-db
          property: connectionString

  # 2. React + Vite Frontend Static Site
  - type: web
    name: pharmaresolve-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: pharmaresolve-backend
          property: host

# 3. Managed PostgreSQL Database
databases:
  - name: pharmaresolve-db
    region: oregon
    plan: free
    databaseName: pharma_qms
    user: pharma_user
